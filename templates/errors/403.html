{% extends "base.html" %}
{% load static %}
{% block title %}403 - Доступ запрещен{% endblock %}
{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center" style="min-height: 70vh;">
  <img
    src="{% static 'img/403.jpg' %}"
    alt="403 Forbidden"
    class="img-fluid mb-4 shadow-sm rounded-4"
    style="max-height: 20rem;"
  >
  <h1 class="display-4 fw-bold text-dark-emphasis mb-2">403</h1>
  <h4 class="mb-3 text-muted">Доступ ограничен</h4>
  <p class="text-muted text-center mb-4" style="max-width: 40rem;">У вас нет прав для просмотра этой страницы. Пожалуйста, авторизуйтесь под подходящим аккаунтом</p>
  <a href="{% url 'index' %}" class="btn btn-dark rounded-pill px-5 py-2 shadow-sm">
    <i class="fa-solid fa-arrow-left me-1" aria-hidden="true"></i>На главную
  </a>
</div>
{% endblock %}
