{% extends "base.html" %}
{% block title %}Загрузка нового арта{% endblock %}
{% block content %}
<div class="d-flex flex-wrap flex-lg-nowrap gap-3 align-items-center pb-3 mb-3 border-bottom">
  <h3 class="mb-0">
    <i class="fa-solid fa-upload me-1" aria-hidden="true"></i>Загрузка нового арта
  </h3>
  <a href="{% url 'index' %}" class="btn btn-dark rounded-pill px-3 shadow-sm ms-auto">
    <i class="fa-solid fa-arrow-left me-1" aria-hidden="true"></i>На главную
  </a>
</div>
<div class="row justify-content-center">
  <div class="col-md-9 col-lg-6">
    <form method="POST" enctype="multipart/form-data" class="card border-0 shadow-sm rounded-4">
      {% csrf_token %}
      <div class="card-body p-4">
        <div class="mb-3">
          <label for="{{ form.images.id_for_label }}" class="form-label">{{ form.images.label }}</label>
          {{ form.images }}
          <div class="form-text small">Можно выбрать от 1 до 15 файлов.</div>
          {% if form.images.errors %}
            <div class="invalid-feedback">{{ form.images.errors|striptags }}</div>
          {% endif %}
        </div>

        <div class="d-flex flex-column flex-lg-row justify-content-lg-end flex-wrap flex-md-nowrap gap-3 pt-3 mt-3 border-top">
          <button type="submit" class="btn btn-sm btn-dark rounded-pill px-3 py-2 shadow-sm" name="_save">
            <i class="fa-solid fa-upload me-1" aria-hidden="true"></i>Загрузить
          </button>
          <button type="submit" class="btn btn-sm btn-dark rounded-pill px-3 py-2 shadow-sm" name="_addanother">
            <i class="fa-solid fa-upload me-1" aria-hidden="true"></i>Загрузить и добавить ещё
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
